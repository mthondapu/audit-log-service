[project]
name = "audit-log-service"
version = "0.1.0"
description = "Tamper-evident, append-only audit log service."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.0",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.6,<4",
    "pydantic>=2.13.5,<3",
    "rfc8785>=0.1.4,<0.2",
    "sqlalchemy>=2.1.1,<3",
    "uvicorn>=0.54.0",
]

[project.scripts]
audit-log-checkpoint = "audit_log_service.cli.checkpoint:main"
audit-log-verify = "audit_log_service.offline.verify:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "httpx>=0.28.1",
    "hypothesis>=6.168.3",
    "pip-audit>=2.10.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# Keep Ruff away from documentation: it would otherwise format code blocks in Markdown.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]

[tool.pyright]
include = ["src", "tests", "migrations"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true

[tool.coverage.run]
source = ["audit_log_service"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
